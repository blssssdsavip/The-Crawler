<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ff3fc8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/><stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee88a" stop-opacity="0.35"/><stop offset="1" stop-color="#2ee88a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="#e83fb4"/>
  <rect x="8" y="8" width="1264" height="344" rx="12" fill="url(#bg)"/>
  <rect x="8" y="8" width="1264" height="344" rx="12" fill="url(#grid)"/>

  <!-- sparkline -->
  <path d="M8 349 L120 344 L200 347 L280 332 L360 335 L440 320 L520 326 L600 310 L680 317 L760 302 L840 307 L920 290 L1000 299 L1080 281 L1160 287 L1272 272 L1272 352 L8 352 Z" fill="url(#spark)"/>
  <path d="M8 349 L120 344 L200 347 L280 332 L360 335 L440 320 L520 326 L600 310 L680 317 L760 302 L840 307 L920 290 L1000 299 L1080 281 L1160 287 L1272 272" fill="none" stroke="#2ee88a" stroke-width="2.5"/>

