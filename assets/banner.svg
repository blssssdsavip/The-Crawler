    <rect x="44" y="36" width="8" height="8" fill="#0b0f1e"/><rect x="60" y="36" width="8" height="8" fill="#0b0f1e"/>
    <g stroke="#ff3fc8" stroke-width="6" stroke-linecap="square" fill="none">
      <path d="M32 32 L12 16 L0 28"/><path d="M32 44 L8 44 L0 60"/><path d="M32 56 L12 72 L4 92"/>
      <path d="M80 32 L100 16 L112 28"/><path d="M80 44 L104 44 L112 60"/><path d="M80 56 L100 72 L108 92"/>
