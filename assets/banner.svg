    <rect x="680" y="220" width="210" height="34" rx="6" fill="#1d2342" stroke="#4ea1ff" stroke-opacity="0.6"/>
    <text x="785" y="242" text-anchor="middle" fill="#4ea1ff">6-STAGE FUNNEL</text>
