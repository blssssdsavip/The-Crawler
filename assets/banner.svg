  <text x="220" y="150" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="2">THE CRAWLER</text>
  <text x="224" y="192" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="18" fill="#9aa3c7" letter-spacing="3">CODE FETCHES · JEV JUDGES · CODE DECIDES · GROK TRADES</text>

  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="700">
    <rect x="224" y="220" width="150" height="34" rx="6" fill="#1d2342" stroke="#ff3fc8" stroke-opacity="0.6"/>
    <text x="299" y="242" text-anchor="middle" fill="#ff7ad9">SOLANA</text>
    <rect x="386" y="220" width="110" height="34" rx="6" fill="#1d2342" stroke="#f3ba2f" stroke-opacity="0.6"/>
    <text x="441" y="242" text-anchor="middle" fill="#f3ba2f">BSC</text>
    <rect x="508" y="220" width="160" height="34" rx="6" fill="#1d2342" stroke="#2ee88a" stroke-opacity="0.6"/>
